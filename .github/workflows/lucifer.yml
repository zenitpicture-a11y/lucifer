name: Lucifier Crawler

on:
  push:
    branches: [ main ]
  workflow_dispatch: # این خط باعث میشه بتونی خودکار استارتش کنی

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lucifier
        env:
          API_KEY: ${{ secrets.API_KEY }} # اگر تو کدت نیاز به API Key داری
        run: python lucifer.py
